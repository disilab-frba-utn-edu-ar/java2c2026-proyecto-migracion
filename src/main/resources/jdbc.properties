# Los valores de abajo son placeholders que Maven reemplaza en build time
# (resource filtering, ver pom.xml) segun el perfil activo:
#   - default (sin -P):  H2 en memoria, modo Oracle.
#   - -Poracle:          Oracle real.

jdbc.driverClassName=${jdbc.driverClassName}
jdbc.url=${jdbc.url}
jdbc.username=${jdbc.username}
jdbc.password=${jdbc.password}

jdbc.pool.initialSize=5
jdbc.pool.maxActive=10
